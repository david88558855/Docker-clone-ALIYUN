name: Docker单镜像转存无tar版（ACR兼容修复版）

# ============================================================================
# 修复说明（第二版）
# ----------------------------------------------------------------------------
# 报错链：
#   1) docker pull/tag/push + docker manifest  -> unknown manifest class for
#      application/vnd.oci.empty.v1+json
#   2) skopeo copy --all --format v2s2         -> unsupported image-specific
#      operation on artifact with type
#      "application/vnd.docker.attestation.manifest.v1+json"
# 两次失败根因相同：源镜像索引里带 OCI 1.1 attestation（provenance/SBOM），
# 其 config 是空描述符。skopeo 的 --all 是「全有或全无」，无法跳过它，
# --format v2s2 也无法把它转成镜像清单，所以必然失败。
#
# 本版做法：用 regctl index create 只挑选真实平台（linux/amd64、linux/arm64 …）
# 的子镜像，重新「组装」一个全新的索引再推到 ACR。attestation 的 platform 是
# unknown/unknown，不在挑选列表里，自然被彻底剔除。
#
# secrets 名称与原版完全一致，无需改动仓库配置。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: '请填写需要拉取hub.Docker的仓库名镜像名版本号如xhofe/alist:latest'
        required: true
        default: ''
      aliname:
        description: '自定义Docker镜像名（避免镜像名重复），默认跟随上方的镜像名如alist'
        required: false
        default: ''
      name:
        description: '自定义Docker镜像的版本号，默认跟随上方的版本如latest'
        required: false
        default: ''
      amd64:
        description: '拉取x86_64架构'
        required: true
        default: true
        type: boolean
      arm64:
        description: '拉取arm64架构'
        required: true
        default: true
        type: boolean
      armv7:
        description: '拉取armv7架构'
        required: false
        default: false
        type: boolean

env:
  DOCKER_REGISTRY: "${{ secrets.DOCKER_REGISTRY }}"
  DOCKER_NAMESPACE: "${{ secrets.DOCKER_NAMESPACE }}"
  DOCKER_REGISTRY_USER: "${{ secrets.DOCKER_REGISTRY_USER }}"
  DOCKER_REGISTRY_PASSWORD: "${{ secrets.DOCKER_REGISTRY_PASSWORD }}"
  line: "${{ github.event.inputs.image_name }}"
  name: "${{ github.event.inputs.name }}"
  aliname: "${{ github.event.inputs.aliname }}"
  amd64: "${{ github.event.inputs.amd64 }}"
  arm64: "${{ github.event.inputs.arm64 }}"
  armv7: "${{ github.event.inputs.armv7 }}"
  # 固定 regctl 版本，避免 runner 工具升级导致「什么都没改却突然失败」
  REGCTL_VERSION: "v0.11.6"

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
    - name: 安装 regctl
      run: |
        curl -fsSL -o /tmp/regctl \
          "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
        sudo install -m 0755 /tmp/regctl /usr/local/bin/regctl
        regctl version

    - name: 登录阿里云 ACR
      # docker login 的凭证写入 ~/.docker/config.json，regctl 会自动读取，
      # 因此 regctl 不需要再单独登录。
      run: echo "$DOCKER_REGISTRY_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_REGISTRY_USER" --password-stdin

    - name: 解析镜像名与版本号
      id: meta
      run: |
        set -e
        image_name_tag=$(echo "$line" | awk -F'/' '{print $NF}')
        image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
        image_tag=$(echo "$image_name_tag" | awk -F':' '{print $2}')
        [[ -n "$image_tag" ]] || image_tag="latest"
        [[ -n "$aliname" ]] && image_name="$aliname"
        [[ -n "$name" ]] && image_tag="$name"
        TARGET="$DOCKER_REGISTRY/$DOCKER_NAMESPACE/$image_name:$image_tag"
        echo "TARGET=$TARGET" >> $GITHUB_ENV
        echo "目标镜像：$TARGET"

    - name: 重建干净索引并推送（剔除 attestation）
      run: |
        set -euo pipefail
        # 按勾选的架构组装 --platform 参数；attestation 是 unknown/unknown，
        # 不会被列进来，因此重建出的索引不含它。
        args=()
        [[ "$amd64" == "true" ]] && args+=(--platform linux/amd64)
        [[ "$arm64" == "true" ]] && args+=(--platform linux/arm64)
        [[ "$armv7" == "true" ]] && args+=(--platform linux/arm/v7)
        if [ ${#args[@]} -eq 0 ]; then
          echo "错误：至少要勾选一个架构" >&2
          exit 1
        fi

        echo "将只搬运以下平台：${args[*]}"
        # 若源镜像缺少某个被勾选的架构，regctl 会报错。
        # 可先看源镜像实际平台：regctl image manifest "$line"
        regctl index create "$TARGET" \
          --ref "$line" \
          "${args[@]}"

    - name: 验证推送结果
      run: |
        echo "目标镜像清单（应只有真实平台，无 unknown/unknown 的 attestation 条目）："
        regctl manifest get "$TARGET"
