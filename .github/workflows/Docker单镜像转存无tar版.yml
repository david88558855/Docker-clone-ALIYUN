name: Docker单镜像转存无tar版（ACR兼容修复版）

# 修复说明：
# 原版用 docker pull/tag/push + docker manifest create/push 搬运镜像，
# 会把源镜像自带的 OCI 1.1 attestation（config = application/vnd.oci.empty.v1+json）
# 一起推给阿里云 ACR，ACR 不支持该 manifest class，导致：
#   error from registry: unknown manifest class for application/vnd.oci.empty.v1+json
# 本版改用 skopeo 直接从源仓库复制到 ACR，并用 --format v2s2 输出 Docker schema2
# 清单，从而剔除 attestation，且一次性保留全部架构。
#
# secrets 名称与原版完全一致，无需改动仓库配置。

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: '请填写需要拉取hub.Docker的仓库名镜像名版本号如xhofe/alist:latest'
        required: true
        default: ''
      aliname:
        description: '自定义Docker镜像名（避免镜像名重复），默认跟随上方的镜像名如alist'
        required: false
        default: ''
      name:
        description: '自定义Docker镜像的版本号，默认跟随上方的版本如latest'
        required: false
        default: ''

env:
  DOCKER_REGISTRY: "${{ secrets.DOCKER_REGISTRY }}"
  DOCKER_NAMESPACE: "${{ secrets.DOCKER_NAMESPACE }}"
  DOCKER_REGISTRY_USER: "${{ secrets.DOCKER_REGISTRY_USER }}"
  DOCKER_REGISTRY_PASSWORD: "${{ secrets.DOCKER_REGISTRY_PASSWORD }}"
  line: "${{ github.event.inputs.image_name }}"
  name: "${{ github.event.inputs.name }}"
  aliname: "${{ github.event.inputs.aliname }}"

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
    - name: 安装 skopeo
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo

    - name: 登录阿里云 ACR
      run: echo "$DOCKER_REGISTRY_PASSWORD" | skopeo login "$DOCKER_REGISTRY" -u "$DOCKER_REGISTRY_USER" --password-stdin

    - name: 解析镜像名与版本号
      id: meta
      run: |
        set -e
        # 取最后一段，如 xhofe/alist:latest -> alist:latest
        image_name_tag=$(echo "$line" | awk -F'/' '{print $NF}')
        image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
        image_tag=$(echo "$image_name_tag" | awk -F':' '{print $2}')
        [[ -n "$image_tag" ]] || image_tag="latest"
        [[ -n "$aliname" ]] && image_name="$aliname"
        [[ -n "$name" ]] && image_tag="$name"
        TARGET="$DOCKER_REGISTRY/$DOCKER_NAMESPACE/$image_name:$image_tag"
        echo "TARGET=$TARGET" >> $GITHUB_ENV
        echo "目标镜像：$TARGET"

    - name: 转存镜像（v2s2，剔除 OCI attestation）
      run: |
        # --all       : 复制多架构索引及全部平台镜像
        # --format v2s2: 转成 Docker schema2，ACR 完全兼容，不携带 OCI attestation
        # --remove-signatures: 不搬运签名（ACR 不需要）
        skopeo copy --all --format v2s2 --remove-signatures \
          "docker://$line" \
          "docker://$TARGET"

    - name: 验证推送结果
      run: |
        echo "目标镜像的顶层清单："
        skopeo inspect --raw "docker://$TARGET"
